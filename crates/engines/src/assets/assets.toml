# The models Craft Anything generates game assets with, and what each one costs (US dollars, the
# provider's listed prices). `provider` names an asset provider in the registry (`fal`), and
# `endpoint` is the model's address at that provider. The `[default]` table picks the model used
# when Settings names none; `[assets] image_model` in config.toml picks another picture model by
# its `id`. A table that doesn't parse falls back to the built-in defaults (a test keeps it parsing).

[default]
image = "nano-banana-pro"
model_3d = "tripo-p1"

# Pictures (textures, skies, concept art), billed by megapixel (`usd_per_megapixel`) or per picture
# (`usd_per_image`). `size_by` says how the model is told the shape: `image_size` (a named size, the
# default) or `aspect_ratio`. `round_up_megapixels` opts into a conservative estimate using whole
# decimal megapixels (1 MP = 1,000,000 pixels); omitted means fractional megapixels.
# FLUX prices and rounding policy checked on 2026-11-02:
# https://fal.ai/models/fal-ai/flux/dev and https://fal.ai/models/fal-ai/flux/schnell
# Both pages say to round up, but fal's publishing guide uses 1024*1024 pixels per unit:
# https://fal.ai/docs/documentation/serverless/publishing-to-marketplace
# Use the larger decimal-MP estimate until invoice units are verified. A 1024-square estimate
# therefore uses two units; this is a conservative budget estimate, not a verified invoice charge.

# Checked on fal's model page on 2026-10-20: $0.15 per picture at 1K and 2K (4K costs double; we ask
# for the default 1K).
[[image]]
id = "nano-banana-pro"
provider = "fal"
name = "Nano Banana Pro"
endpoint = "fal-ai/nano-banana-pro"
usd_per_image = 0.15
size_by = "aspect_ratio"
licence = "Commercial use enabled through fal.ai"

[[image]]
id = "flux-dev"
provider = "fal"
name = "FLUX.1 [dev]"
endpoint = "fal-ai/flux/dev"
usd_per_megapixel = 0.025
round_up_megapixels = true
licence = "FLUX.1 [dev] Non-Commercial License (model weights)"

[[image]]
id = "flux-schnell"
provider = "fal"
name = "FLUX.1 [schnell]"
endpoint = "fal-ai/flux/schnell"
usd_per_megapixel = 0.003
round_up_megapixels = true
licence = "Apache-2.0 (model weights)"

# Game-ready 3D models (GLB) from a picture, billed per model; `faces` is the face-count range the
# model accepts.
[[model_3d]]
id = "tripo-p1"
provider = "fal"
name = "Tripo P1"
endpoint = "tripo3d/p1/image-to-3d"
usd = 0.40
textured_usd = 0.50
faces = [48, 20000]

# Scenario prices below are conservative per-request SPENDING CEILINGS, not quoted prices.
# Every generation first uses dryRun=api and refuses quotes above the ceiling.
# Quoted CU are converted at Starter's $15/1500CU ($0.01/CU); actual invoices vary by plan.
# https://www.scenario.com/pricing (checked 2026-11-02)
# https://docs.scenario.com/api/resources/generate/methods/run_model
[[image]]
id = "scenario-gemini-3-1"
provider = "scenario"
name = "Scenario Gemini 3.1 (spending ceiling)"
endpoint = "model_google-gemini-3-1-flash"
usd_per_image = 1.0
size_by = "aspect_ratio"
licence = "Paid Scenario plan required; displayed USD is a spending ceiling, checked against a live CU quote"

[[model_3d]]
id = "scenario-meshy"
provider = "scenario"
name = "Scenario Meshy 6 (spending ceiling)"
endpoint = "model_meshy-img23d"
usd = 10.0
textured_usd = 10.0
faces = [100, 300000]
licence = "Paid Scenario plan required; displayed USD is a spending ceiling; polygon count is a target"

# Published API rates, checked 2026-11-02 at https://elevenlabs.io/pricing/api.
# Estimates exclude taxes; account/voice pricing may differ. Audio is MP3.
[[audio]]
id = "eleven-multilingual-v2"
provider = "elevenlabs"
name = "ElevenLabs Multilingual v2"
endpoint = "eleven_multilingual_v2"
kind = "speech"
billing = "character"
usd_per_unit = 0.00008

[[audio]]
id = "eleven-sound-effects-v2"
provider = "elevenlabs"
name = "ElevenLabs Sound Effects v2"
endpoint = "eleven_text_to_sound_v2"
kind = "sound_effect"
billing = "second"
usd_per_unit = 0.002

[[audio]]
id = "eleven-music-v1"
provider = "elevenlabs"
name = "ElevenLabs Music v1"
endpoint = "music_v1"
kind = "music"
billing = "second"
usd_per_unit = 0.0025
